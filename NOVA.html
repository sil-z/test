<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - Theme Toggle Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 定义暗色主题（默认）颜色变量 */
        :root {
            --bg-color: #0c0e14;
            --text-stroke: rgba(78, 205, 196, 0.3);
            --text-shadow-base: rgba(142, 227, 240, 0.05);
            --text-shadow-glow: rgba(142, 227, 240, 0.4);
        }

        /* 定义亮色主题颜色变量 */
        body.light-mode {
            --bg-color: #f4f7fa;
            --text-stroke: rgba(44, 62, 80, 0.15);
            --text-shadow-base: rgba(72, 219, 251, 0.1);
            --text-shadow-glow: rgba(72, 219, 251, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color); 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-text {
            position: absolute;
            font-family: 'Jost', sans-serif;
            font-size: 3vw; 
            font-weight: 900; 
            letter-spacing: 1.5vw;
            padding-left: 1.5vw; 
            color: transparent; 
            -webkit-text-stroke: 2px var(--text-stroke); 
            text-shadow: 0 0 30px var(--text-shadow-base); 
            pointer-events: none; 
            user-select: none;
            z-index: 0;
            animation: breathe-base 5s ease-in-out infinite;
        }

        .bg-text::after {
            content: 'CLICK TO EXPLODE';
            position: absolute;
            top: 0;
            left: 0;
            padding-left: inherit;
            color: transparent;
            text-shadow: 0 0 50px var(--text-shadow-glow); 
            animation: breathe-glow 5s ease-in-out infinite;
        }

        @keyframes breathe-base {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes breathe-glow {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-text">CLICK TO EXPLODE</div>

    <script>
        class ParticleNetwork {
            constructor(options = {}) {
                const defaultOptions = {
                    container: document.body,
                    zIndex: 0,
                    particleCount: 200,                
                    particleRadius: 3,                 
                    initialVelocity: 1,              
                    
                    dampingThreshold: 1,               
                    dampingFactor: 0.99,               
                    
                    connectDistance: 180,              
                    connectOpacityMax: 0.15,           
                    connectLineWidth: 1,               
                    
                    mouseRadius: 150,                  
                    mouseBuffer: 10,                   
                    
                    implosionFrames: 300,               
                    implosionPullRadius: 400,          
                    implosionPullForce: 0.1,           
                    implosionRingMaxRadius: 120,       
                    implosionRingLineWidth: 1.5,       
                    implosionHideRadius: 10,       

                    explosionBlastRadius: 250,         
                    explosionBlastForce: 25,           
                    explosionCooldown: 80,             
                    
                    explosionRippleSpeed: 12,          
                    explosionRippleFade: 0.03,         
                    explosionRippleLineWidth: 2,        

                    particleRepulsionRadius: 8,       
                    particleRepulsionForce: 0.02       
                };

                this.opts = { ...defaultOptions, ...options };
                this.container = this.opts.container;
                this.zIndex = this.opts.zIndex;
                
                this.particles = [];
                this.explosions = []; 
                this.mouse = { x: null, y: null };
                this.mouseCooldown = 0;  
                this.implosionTimer = 0; 
                this.clickX = 0;         
                this.clickY = 0;
                this.animationFrameId = null;

                this.isLight = Math.random() > 0.5;
                this.applyTheme();

                this.init();
            }

            applyTheme() {
                if (this.isLight) {
                    document.body.classList.add('light-mode');
                    this.opts.colors = ['#FF6B6B', '#48DBFB', '#1DD1A1', '#FECA57', '#9b59b6']; 
                    // 【修改】将亮色模式的光圈和波纹改为深色（深灰蓝色），增强对比度
                    this.opts.effectRgb = '44, 62, 80'; 
                    this.opts.lineRgb = '110, 130, 150';  
                } else {
                    document.body.classList.remove('light-mode');
                    this.opts.colors = ['#8ee3f0', '#4ecdc4', '#2b9eac']; 
                    this.opts.effectRgb = '142, 227, 240'; 
                    this.opts.lineRgb = '142, 227, 240';  
                }

                if (this.particles && this.particles.length > 0) {
                    this.particles.forEach(p => {
                        p.color = this.opts.colors[Math.floor(Math.random() * this.opts.colors.length)];
                    });
                }
            }

            toggleTheme() {
                this.isLight = !this.isLight;
                this.applyTheme();
            }

            init() {
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.canvas.style.position = this.container === document.body ? 'fixed' : 'absolute';
                this.canvas.style.top = '0';
                this.canvas.style.left = '0';
                this.canvas.style.width = '100%';
                this.canvas.style.height = '100%';
                this.canvas.style.zIndex = this.zIndex;
                
                if (this.container !== document.body && getComputedStyle(this.container).position === 'static') {
                    this.container.style.position = 'relative';
                }
                
                this.container.appendChild(this.canvas);

                this.resizeHandler = () => this.resize();
                window.addEventListener('resize', this.resizeHandler);
                
                this.canvas.addEventListener('mousemove', (e) => {
                    let rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                });
                
                this.canvas.addEventListener('mouseout', () => {
                    this.mouse.x = null;
                    this.mouse.y = null;
                });

                this.canvas.addEventListener('mousedown', (e) => {
                    if (e.button === 0 && this.mouseCooldown === 0 && this.implosionTimer === 0) { 
                        let rect = this.canvas.getBoundingClientRect();
                        this.clickX = e.clientX - rect.left;
                        this.clickY = e.clientY - rect.top;
                        
                        this.implosionTimer = this.opts.implosionFrames; 
                        
                        this.particles.forEach(p => {
                            let dx = this.clickX - p.x;
                            let dy = this.clickY - p.y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < this.opts.implosionPullRadius) {
                                p.maxAllowedDist = dist;
                            } else {
                                p.maxAllowedDist = Infinity;
                            }
                        });
                    }
                });

                this.resize();
                this.createParticles();
                this.animate();
            }

            resize() {
                this.canvas.width = this.container.clientWidth || window.innerWidth;
                this.canvas.height = this.container.clientHeight || window.innerHeight;
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.opts.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * this.opts.initialVelocity,
                        vy: (Math.random() - 0.5) * this.opts.initialVelocity,
                        color: this.opts.colors[Math.floor(Math.random() * this.opts.colors.length)],
                        maxAllowedDist: Infinity,
                        isHidden: false
                    });
                }
            }

            triggerExplosion(x, y) {
                this.mouseCooldown = this.opts.explosionCooldown; 

                this.explosions.push({
                    x: x, y: y, radius: 0, alpha: 1
                });

                this.particles.forEach(p => {
                    let dx = p.x - x;
                    let dy = p.y - y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < this.opts.explosionBlastRadius && dist > 0) {
                        let force = (this.opts.explosionBlastRadius - dist) / this.opts.explosionBlastRadius;
                        p.vx += (dx / dist) * force * this.opts.explosionBlastForce;
                        p.vy += (dy / dist) * force * this.opts.explosionBlastForce;
                    }
                    
                    p.maxAllowedDist = Infinity;
                    p.isHidden = false; 
                });
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.implosionTimer > 0) {
                    this.implosionTimer--;
                    
                    this.particles.forEach(p => {
                        let dx = this.clickX - p.x;
                        let dy = this.clickY - p.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < this.opts.implosionPullRadius) {
                            if (dist > 5) {
                                p.vx += (dx / dist) * this.opts.implosionPullForce;
                                p.vy += (dy / dist) * this.opts.implosionPullForce;
                            }

                            if (dist > p.maxAllowedDist && p.maxAllowedDist > 0) {
                                let nx = dx / dist;
                                let ny = dy / dist;
                                p.x = this.clickX - nx * p.maxAllowedDist;
                                p.y = this.clickY - ny * p.maxAllowedDist;
                                
                                let dotProduct = p.vx * nx + p.vy * ny;
                                if (dotProduct < 0) { 
                                    p.vx -= dotProduct * nx;
                                    p.vy -= dotProduct * ny;
                                    p.vx *= 0.75;
                                    p.vy *= 0.75;
                                }
                            } else {
                                p.maxAllowedDist = dist;
                            }
                        } else {
                            p.maxAllowedDist = Infinity;
                        }
                        
                        p.isHidden = dist < this.opts.implosionHideRadius;
                    });

                    let progress = this.implosionTimer / this.opts.implosionFrames; 
                    this.ctx.beginPath();
                    this.ctx.arc(this.clickX, this.clickY, progress * this.opts.implosionRingMaxRadius, 0, Math.PI * 2);
                    this.ctx.strokeStyle = `rgba(${this.opts.effectRgb}, ${1 - progress})`; 
                    this.ctx.lineWidth = this.opts.implosionRingLineWidth;
                    this.ctx.stroke();

                    if (this.implosionTimer === 0) {
                        this.triggerExplosion(this.clickX, this.clickY);
                    }
                }

                if (this.mouseCooldown > 0) {
                    this.mouseCooldown--;
                }

                for (let i = this.explosions.length - 1; i >= 0; i--) {
                    let exp = this.explosions[i];
                    exp.radius += this.opts.explosionRippleSpeed; 
                    exp.alpha -= this.opts.explosionRippleFade; 

                    if (exp.alpha <= 0) {
                        this.explosions.splice(i, 1);
                    } else {
                        this.ctx.beginPath();
                        this.ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                        this.ctx.strokeStyle = `rgba(${this.opts.effectRgb}, ${exp.alpha})`; 
                        this.ctx.lineWidth = this.opts.explosionRippleLineWidth;
                        this.ctx.stroke();
                    }
                }

                const repRadiusSq = this.opts.particleRepulsionRadius * this.opts.particleRepulsionRadius;
                const connDistanceSq = this.opts.connectDistance * this.opts.connectDistance;

                for (let i = 0; i < this.opts.particleCount; i++) {
                    let p = this.particles[i];

                    if (this.mouse.x != null && this.mouse.y != null && 
                        this.mouseCooldown === 0 && this.implosionTimer === 0) {
                        let dx = p.x - this.mouse.x;
                        let dy = p.y - this.mouse.y;
                        let distSq = dx * dx + dy * dy;
                        const LIMIT_SQ = this.opts.mouseRadius * this.opts.mouseRadius;
                        const BUFFER = this.opts.mouseBuffer;

                        if (distSq < LIMIT_SQ && distSq > (this.opts.mouseRadius - BUFFER) ** 2) {
                            let dist = Math.sqrt(distSq);
                            let nx = dx / dist;
                            let ny = dy / dist;
                            let dotProduct = p.vx * nx + p.vy * ny;
                            
                            if (dotProduct > 0) {
                                p.vx -= 2 * dotProduct * nx;
                                p.vy -= 2 * dotProduct * ny;
                            }
                        }
                    }

                    let speedSq = p.vx * p.vx + p.vy * p.vy;
                    if (speedSq > this.opts.dampingThreshold) { 
                        p.vx *= this.opts.dampingFactor;
                        p.vy *= this.opts.dampingFactor;
                    }

                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < this.opts.particleRadius || p.x > this.canvas.width - this.opts.particleRadius) p.vx *= -1;
                    if (p.y < this.opts.particleRadius || p.y > this.canvas.height - this.opts.particleRadius) p.vy *= -1;

                    if (!p.isHidden) {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, this.opts.particleRadius, 0, Math.PI * 2);
                        this.ctx.fillStyle = p.color;
                        this.ctx.fill();
                    }

                    for (let j = i + 1; j < this.opts.particleCount; j++) {
                        let p2 = this.particles[j];
                        let dxLine = p.x - p2.x;
                        let dyLine = p.y - p2.y;
                        let distSq = dxLine * dxLine + dyLine * dyLine;

                        if (distSq < connDistanceSq || distSq < repRadiusSq) {
                            let distance = Math.sqrt(distSq);

                            if (distSq < repRadiusSq && distance > 0 && !p.isHidden && !p2.isHidden) {
                                let force = (this.opts.particleRepulsionRadius - distance) / this.opts.particleRepulsionRadius * this.opts.particleRepulsionForce;
                                let fx = (dxLine / distance) * force;
                                let fy = (dyLine / distance) * force;
                                
                                p.vx += fx;
                                p.vy += fy;
                                p2.vx -= fx;
                                p2.vy -= fy;
                            }

                            if (distSq < connDistanceSq && !p.isHidden && !p2.isHidden) {
                                let opacity = 1 - (distance / this.opts.connectDistance);
                                
                                if (opacity > 0.05) {
                                    this.ctx.beginPath();
                                    this.ctx.strokeStyle = `rgba(${this.opts.lineRgb}, ${opacity * this.opts.connectOpacityMax})`;
                                    this.ctx.lineWidth = this.opts.connectLineWidth;
                                    this.ctx.moveTo(p.x, p.y);
                                    this.ctx.lineTo(p2.x, p2.y);
                                    this.ctx.stroke();
                                }
                            }
                        }
                    }
                }

                this.animationFrameId = requestAnimationFrame(() => this.animate());
            }

            destroy() {
                cancelAnimationFrame(this.animationFrameId);
                window.removeEventListener('resize', this.resizeHandler);
                if (this.canvas.parentNode) {
                    this.canvas.parentNode.removeChild(this.canvas);
                }
            }
        }

        const network = new ParticleNetwork({ particleCount: 200 });

        // 监听空格键切换主题配色
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止按下空格时页面向下滚动
                if (e.repeat) return; // 【修复】拦截长按连续触发，确保按一次切一次
                network.toggleTheme();
            }
        });
    </script>
</body>
</html>
